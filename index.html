<style>
  :root{

  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);

  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 40px}

  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700;margin-bottom:8px}
  h1{margin:0;font-size:32px;line-height:1.15;letter-spacing:-.02em}
  h1 span{color:var(--sub);font-weight:600}
  .sub{margin:8px 0 0;color:var(--sub);font-size:14px}
  .status-box{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:650;background:#e2e8f0;color:#475569;border:1px solid rgba(15,23,42,.06)}
  .pill i{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block}
  .pill.live{background:#e7f8f1;color:#047857;border-color:#b7ead7}
  .pill.live i{background:var(--live);box-shadow:0 0 0 0 rgba(16,185,129,.55);animation:pulse 1.8s infinite}
  .pill.lunch{background:#fff7e6;color:#b45309;border-color:#fde3b0}.pill.lunch i{background:#f59e0b}
  .pill.closed{background:#eef2f7;color:#475569}

  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .card{background:var(--card);border:1px solid rgba(15,23,42,.05);border-radius:18px;padding:20px 20px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}

  .ticker{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border-radius:8px;background:#0f172a;color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em}
  .contract{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .exch{margin-left:auto;font-size:11px;color:var(--sub);background:#f1f5f9;border:1px solid var(--line);padding:3px 8px;border-radius:999px}
  .name{color:var(--sub);font-size:13px;margin-bottom:10px}
  .quote{display:flex;align-items:baseline;gap:6px}
  .price{font-size:clamp(30px,4.6vw,40px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .unit{font-size:12px;color:var(--sub);font-weight:600}
  .up .price{color:var(--up)}.down .price{color:var(--down)}
  .delta{margin-top:8px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--flat)}
  .delta em{font-style:normal;font-size:11px;color:#94a3b8;font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .stats div{display:flex;flex-direction:column;gap:3px}
  .stats span{font-size:11px;color:#94a3b8}
  .stats b{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
  .card-foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums}
  .notice{margin-top:16px;padding:12px 16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:13px}
  .notice[hidden]{display:none}
  footer{margin-top:26px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:12px}
  footer .grow{flex:1}
  footer b{color:var(--ink);font-variant-numeric:tabular-nums}
  button.refresh{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:650;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  button.refresh:hover{border-color:#c7d2fe;color:var(--accent)}
  button.refresh:disabled{opacity:.55;cursor:wait}
  .skeleton{height:280px;border-radius:18px;background:linear-gradient(90deg,#f1f5f9 25%,#e9eef6 37%,#f1f5f9 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @media (min-width:861px){.wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center}}
  .pill.warn{background:#fff7e6;color:#b45309;border-color:#fde3b0}
  .pill.hold{background:#e7f8f1;color:#047857;border-color:#b7ead7}
  .pf{margin-top:22px;background:#fff;border:1px solid rgba(15,23,42,.05);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .pf[hidden]{display:none}
  .pf-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .pf-head h2{margin:0;font-size:18px}
  .pf-head .pill{margin-left:auto}
  .pf-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .pf-stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
  .pf-stat span{font-size:11px;color:#94a3b8}
  .pf-stat b{font-size:17px;font-variant-numeric:tabular-nums;font-weight:750}
  .pf-stat b.pos{color:var(--up)}.pf-stat b.neg{color:var(--down)}
  .pf-banner{display:flex;gap:8px;align-items:flex-start;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:12px;border:1px solid}
  .pf-banner.sell{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .pf-banner.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
  .pf-banner.hold{background:#ecfdf5;border-color:#bbf7d0;color:#047857}
  .pf-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .pf-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  .pf-table th{text-align:left;background:#f8fafc;color:var(--sub);font-weight:600;font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line)}
  .pf-table td{padding:10px;border-bottom:1px solid #f1f5f9;font-variant-numeric:tabular-nums}
  .pf-table tr:last-child td{border-bottom:none}
  .pf-table .pos{color:var(--up);font-weight:700}.pf-table .neg{color:var(--down);font-weight:700}
  .pf-table .muted{color:#94a3b8;font-weight:400}
  .pf-sig{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:650}
  .pf-sig.sell{background:#fee2e2;color:#b91c1c}.pf-sig.warn{background:#ffedd5;color:#9a3412}
  .pf-sig.hold{background:#e7f8f1;color:#047857}.pf-sig.muted{background:#f1f5f9;color:#64748b}
  .pf-note{margin:12px 0 0;font-size:11px;color:#94a3b8;line-height:1.6}
  .pf-gate{margin-top:22px;background:#fff;border:1px solid rgba(15,23,42,.05);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .pf-gate[hidden]{display:none}
  .pf-gate-box{max-width:420px;margin:0 auto;text-align:center}
  .pf-gate h3{margin:0 0 6px;font-size:16px}
  .pf-gate p{margin:0 0 12px;color:var(--sub);font-size:12px}
  .pf-gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:8px;outline:none}
  .pf-gate button{border:1px solid var(--line);background:#0f172a;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:650;cursor:pointer}
  .pf-gate-err{color:#b91c1c;font-size:12px;margin-top:8px;min-height:16px}
  @media (max-width:860px){
    .grid{grid-template-columns:1fr}.wrap{padding:22px 14px 32px}h1{font-size:26px}.card{padding:18px 18px 14px}
    .status-box{flex-direction:row;align-items:center;gap:12px;width:100%}
    footer{flex-direction:column;align-items:flex-start;gap:6px}footer .refresh{margin-top:6px}
    .pf{padding:16px}.pf-summary{grid-template-columns:repeat(2,1fr)}
    .pf-table thead{display:none}
    .pf-table,.pf-table tbody,.pf-table tr,.pf-table td{display:block;width:100%}
    .pf-table tr{border-bottom:1px solid var(--line);padding:6px 0}
    .pf-table tr:last-child{border-bottom:none}
    .pf-table td{border:none;display:flex;justify-content:space-between;gap:10px;padding:5px 12px;white-space:normal}
    .pf-table td::before{content:attr(data-label);color:#94a3b8;font-size:11px;flex:0 0 auto}
  }
  @media (prefers-reduced-motion:reduce){.pill.live i{animation:none}.skeleton{animation:none}}
</style>
</head>

<script>
(function(){
  "use strict";
  var REFRESH_MS = 10 * 60 * 1000;
  var LEGS = [

    {key:"TL", symbol:"TL2612", name:"30年期国债期货", exchange:"中金所", unit:"元", dec:3},
    {key:"AU", symbol:"AU2612", name:"黄金期货", exchange:"上期所", unit:"元/克", dec:2}
  ];
  var grid = document.getElementById("grid");
  var notice = document.getElementById("notice");

  var clockEl = document.getElementById("clock");
  var pill = document.getElementById("statusPill");
  var statusText = document.getElementById("statusText");
  var btn = document.getElementById("refreshBtn");
  var nextAt = 0, loading = false;
  var PF_ENC = {"v":1,"salt":"A6I1+AKywsa5Wigpn9bflw==","iv":"tcveTdc4CfnXyp5s","ct":"SUfZbgsLK0Xa3ding8Pig9Qp4ARfKkq+dqGhiY9xiHEnCryIqU51a8S6XrsmLt1oDNpPk9OWrcpvzCKKczd0gr/2NiN+LDu0SuQktZcgKuRTBDTsQYwA3jKmbwtHnCrNnZn94ooKlEmLN2OkVxliyGqDrHWxWzryU8wSVSARRBxqONwb7jOS8973k/Knjnyz4Df4Fc9xHnbMiwBZ5jXmXGRccnngTjkMdU+N4JYQ7hQunVNOM6ljOXEvC38Vrmsq6pNF6c/XqiIe5b7FWIT7gQiNppBLMP9okvaxUgkJ6JOm9j57M2WyzXk5k9HQFiYcF87jzbJv1EdOvHHkqncQOSd3suW5CXXYLWyZ2UALXStPJJhiKuTGeePueq/VmJQPCaDZJlC7QHZMIj2DWHUEmwLz71Puw8+3B9np5W2psWAB4RcpOKbZbj+sh927rmA1mhV2vpKhDQzWbO/HU6yKuCb2V7whQEnaac/HEDgp7zGLO8WKyZtSWX88eWFUb60Rc9UoL5N1CbCtFG1rZ2BouW2AYhofp3obT8Tmq9VxpBtH4p3hp643+GhzHKaecA0i+y0BS4FcpNBpZ0zzXIfOGW6EyJ4Mg5gXeCRdC5TsupLP8YQO/D1kwZLMlldnkvPg70+G6mJ93Dj6f/29MiAM3snLxuhE6BPKwAbyBA0KsPA8KUEeakdLrADoHasi0hhBWNwY9Au3yagcqxmW0lcOgC7vD9yFxILvGRP2jCE="};
  var pfSection = document.getElementById("pfSection");
  var pfGate = document.getElementById("pfGate");
  var pfSummary = document.getElementById("pfSummary");
  var pfBanner = document.getElementById("pfBanner");
  var pfTable = document.getElementById("pfTable");
  var pfNote = document.getElementById("pfNote");
  var pfRiskPill = document.getElementById("pfRiskPill");
  var pfKeyInput = document.getElementById("pfKeyInput");
  var pfUnlockBtn = document.getElementById("pfUnlockBtn");
  var pfGateErr = document.getElementById("pfGateErr");
  var PF = {holdings: null, items: null, pass: null};

  function b64buf(s){
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  async function decryptPF(enc, pass){
    var salt = b64buf(enc.salt), iv = b64buf(enc.iv), ct = b64buf(enc.ct);
    var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
      km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: iv}, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function trendText(price, ma20, ma60){
    if (!price || !ma20) return "—";
    if (ma60){
      if (price >= ma20 && price >= ma60) return "多头排列";
      if (price >= ma20) return "站上20日线";
      if (price >= ma60) return "跌破20日线";
      return "空头排列";
    }
    return price >= ma20 ? "站上20日线" : "跌破20日线";
  }
  function legAction(pnlPct, price, ma20, ma60, risk){
    if (pnlPct == null) return {level: "muted", text: "行情缺失"};
    var stop = risk.leg_stop_pct == null ? -10 : risk.leg_stop_pct;
    var warn = risk.leg_warn_pct == null ? -8 : risk.leg_warn_pct;
    var take = risk.leg_take_profit_pct == null ? 20 : risk.leg_take_profit_pct;
    var below20 = !!(ma20 && price && price < ma20);
    var below60 = !!(ma60 && price && price < ma60);
    if (pnlPct <= stop) return {level: "sell", text: "触发止损线，建议减仓/离场"};
    if (pnlPct >= take) return {level: "sell", text: "达到止盈线，建议分批止盈"};
    if (pnlPct <= warn) return {level: "warn", text: below20 ? "接近止损线且跌破20日线" : "接近止损线"};
    if (below20 && below60) return {level: "warn", text: "跌破20/60日线，趋势偏弱"};
    if (below20) return {level: "warn", text: "跌破20日线，趋势转弱"};
    return {level: "hold", text: "趋势持有"};
  }
  function computePortfolio(h, items){
    var by = {};
    items.forEach(function(i){ by[i.key] = i; });
    var risk = h.risk || {};
    var positions = (h.positions || []).map(function(p){
      var q = by[p.key];
      var price = q ? q.price : null;
      var pnl = price != null ? p.qty * p.mult * (price - p.cost) : null;
      var pnlPct = (pnl != null && p.margin) ? pnl / p.margin * 100 : null;
      var ma20 = q ? q.ma20 : null, ma60 = q ? q.ma60 : null;
      return {
        key: p.key, name: p.name, qty: p.qty, cost: p.cost, margin: p.margin,
        price: price, pnl: pnl, pnl_pct: pnlPct, margin_pct: null,
        ma20: ma20, ma60: ma60, trend: trendText(price, ma20, ma60),
        signal: legAction(pnlPct, price, ma20, ma60, risk)
      };
    });
    var total = 0, marginTotal = 0;
    positions.forEach(function(p){ if (p.pnl != null) total += p.pnl; marginTotal += p.margin; });
    var equity = Number(h.static_equity || 0) + total;
    positions.forEach(function(p){ p.margin_pct = equity > 0 ? p.margin / equity * 100 : null; });
    var riskRatio = equity > 0 ? marginTotal / equity : null;
    var order = {sell: 3, warn: 2, hold: 1, muted: 0};
    var overall = positions.length ? positions.reduce(function(a,b){ return order[b.signal.level] > order[a.signal.level] ? b : a; }) : null;
    var signal;
    if (riskRatio != null && riskRatio >= (risk.margin_critical || 0.9)) {
      signal = {level: "sell", text: "保证金风险度 ≥90%，有强平风险，建议立即减仓"};
    } else if (riskRatio != null && riskRatio >= (risk.margin_warn || 0.8)) {
      signal = {level: "warn", text: "保证金风险度 ≥80%，建议减仓"};
    } else if (total / Number(h.static_equity || 1) * 100 <= (risk.portfolio_stop_pct || -10)) {
      signal = {level: "sell", text: "组合浮亏达到止损线，建议减仓"};
    } else if (overall && (overall.signal.level === "sell" || overall.signal.level === "warn")) {
      signal = {level: overall.signal.level, text: overall.name + "：" + overall.signal.text};
    } else {
      signal = {level: "hold", text: "风险度正常，持仓按趋势管理"};
    }
    return {
      equity: equity, floating_pnl: total, margin: marginTotal,
      available: equity - marginTotal, risk_pct: riskRatio != null ? riskRatio * 100 : null,
      signal: signal, positions: positions,
      note: "卖出信号：单腿保证金亏损≤-10%止损、≥+20%止盈；风险度≥80%减仓；跌破20日线提示趋势转弱。当前三腿均持多，买入信号仅在空仓且站上20日线时提示。"
    };
  }
  function stat(label, value, cls){
    return '<div class="pf-stat"><span>' + label + '</span><b class="' + (cls || "") + '">' + value + '</b></div>';
  }
  function renderPortfolio(){
    if (!PF.holdings || !PF.items) return;
    var d = computePortfolio(PF.holdings, PF.items);
    pfGate.hidden = true;
    pfSection.hidden = false;
    var cls = d.signal.level === "sell" ? "sell" : (d.signal.level === "warn" ? "warn" : "hold");
    pfRiskPill.className = "pill " + cls;
    pfRiskPill.textContent = "风险度 " + (d.risk_pct == null ? "—" : d.risk_pct.toFixed(1) + "%");
    pfSummary.innerHTML =
      stat("当前权益", "¥" + nf(d.equity, 0), "") +
      stat("浮动盈亏", (d.floating_pnl > 0 ? "+" : (d.floating_pnl < 0 ? "-" : "")) + "¥" + nf(Math.abs(d.floating_pnl), 0), d.floating_pnl >= 0 ? "pos" : "neg") +
      stat("保证金占用", "¥" + nf(d.margin, 0), "") +
      stat("可用资金", "¥" + nf(d.available, 0), "");
    pfBanner.className = "pf-banner " + cls;
    pfBanner.textContent = (cls === "sell" ? "⛔ " : (cls === "warn" ? "⚠ " : "✓ ")) + d.signal.text;
    var head = '<thead><tr><th>品种</th><th>方向/手数</th><th>开仓均价</th><th>现价</th><th>浮动盈亏</th><th>盈亏/保证金</th><th>保证金占比</th><th>趋势</th><th>操作信号</th></tr></thead><tbody>';
    var rows = d.positions.map(function(p){
      var pc = p.pnl > 0 ? "pos" : (p.pnl < 0 ? "neg" : "");
      var dec = p.key === "IF" ? 1 : (p.key === "TL" ? 3 : 2);
      return '<tr>' +
        '<td data-label="品种"><b>' + p.key + '</b> <span class="muted">' + (p.name || "") + '</span></td>' +
        '<td data-label="方向/手数">多 ' + p.qty + ' 手</td>' +
        '<td data-label="开仓均价">' + nf(p.cost, dec) + '</td>' +
        '<td data-label="现价">' + nf(p.price, dec) + '</td>' +
        '<td data-label="浮动盈亏" class="' + pc + '">' + (p.pnl > 0 ? "+" : "") + nf(p.pnl, 0) + '</td>' +
        '<td data-label="盈亏/保证金" class="' + pc + '">' + (p.pnl_pct > 0 ? "+" : "") + nf(p.pnl_pct, 2) + '%</td>' +
        '<td data-label="保证金占比">' + (p.margin_pct == null ? "—" : nf(p.margin_pct, 1) + '%') + '</td>' +
        '<td data-label="趋势">' + p.trend + '</td>' +
        '<td data-label="操作信号"><span class="pf-sig ' + p.signal.level + '">' + p.signal.text + '</span></td>' +
        '</tr>';
    }).join("");
    pfTable.innerHTML = head + rows + '</tbody>';
    pfNote.textContent = d.note;
  }
  async function unlockPF(pass, showError){
    try {
      var h = await decryptPF(PF_ENC, pass);
      PF.holdings = h; PF.pass = pass;
      try { localStorage.setItem("ift_pf_pass", pass); } catch (e) {}
      pfGate.hidden = true;
      renderPortfolio();
    } catch (e) {
      PF.holdings = null;
      if (showError) {
        pfGate.hidden = false;
        pfGateErr.textContent = "口令不正确";
      }
    }
  }
  pfUnlockBtn.addEventListener("click", function(){
    var p = pfKeyInput.value.trim();
    if (!p) { pfGateErr.textContent = "请输入口令"; return; }
    unlockPF(p, true);
  });
  pfKeyInput.addEventListener("keydown", function(e){ if (e.key === "Enter") pfUnlockBtn.click(); });
  var pfOpenBtn = document.getElementById("pfOpenBtn");
  pfOpenBtn.addEventListener("click", function(){
    if (PF.holdings) {
      pfSection.scrollIntoView({behavior: "smooth", block: "start"});
    } else {
      pfGate.hidden = false;
      pfKeyInput.focus();
    }
  });
  (function initPass(){
    var p = null, showError = false;
    try { var m = (window.location.hash || "").match(/^#k=(.+)$/); if (m) { p = decodeURIComponent(m[1]); showError = true; } } catch (e) {}
    if (!p) {
      try {
        var q = new URLSearchParams(window.location.search).get("k");
        if (q) { p = q; showError = true; }
      } catch (e) {}
    }
    if (!p) { try { p = localStorage.getItem("ift_pf_pass"); } catch (e) {} }
    if (p) unlockPF(p, showError);
  })();

  function nf(v, d){
    if (v === null || v === undefined || isNaN(v)) return "—";
    return Number(v).toLocaleString("zh-CN", {minimumFractionDigits: d, maximumFractionDigits: d});
  }
  function dirOf(v){ return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
  function hhmmss(s){ return s ? String(s).split(" ")[1] || s : "—"; }
  function parseCst(s){ return s ? new Date(String(s).replace(" ","T") + "+08:00") : null; }
  function cstNow(){ return new Date(Date.now() + 8*3600*1000); }
  function fmtClock(d){ return [d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return String(n).padStart(2,"0")}).join(":"); }
  function setPill(status){
    var cls = status === "交易中" ? "live" : (status === "午间休市" ? "lunch" : "closed");
    pill.className = "pill " + cls;
    statusText.textContent = status || "—";
  }
  function crop(v, d){ return v == null ? null : Math.round(v * Math.pow(10, d)) / Math.pow(10, d); }

  function jsonp(varName, method, symbol, extra){
    return new Promise(function(resolve, reject){
      var s = document.createElement("script");
      window[varName] = undefined;
      s.src = "https://stock2.finance.sina.com.cn/futures/api/jsonp.php/var%20" + varName +
              "=/InnerFuturesNewService." + method + "?symbol=" + symbol + extra +
              "&_=" + Date.now();
      s.onload = function(){
        var data = window[varName];
        if (s.parentNode) s.parentNode.removeChild(s);
        if (data && data.length) resolve(data);
        else reject(new Error("empty " + varName));
      };
      s.onerror = function(){
        if (s.parentNode) s.parentNode.removeChild(s);
        reject(new Error("script " + varName));
      };
      document.head.appendChild(s);
    });
  }

  function summarize(leg, mins, days){
    var last = mins[mins.length - 1];
    var price = Number(last.c);
    var lastDay = days[days.length - 1];
    var prevRef = null;
    if (lastDay){
      var settle = Number(lastDay.s);
      prevRef = (isFinite(settle) && settle > 0) ? settle : Number(lastDay.c);
    }
    var cutoff = (lastDay ? lastDay.d : "1970-01-01") + " 15:15:00";
    var bars = mins.filter(function(b){ return b.d > cutoff; });
    var open, high, low, volume, oi, statDate;
    if (bars.length){
      high = -Infinity; low = Infinity; volume = 0;
      bars.forEach(function(b){
        high = Math.max(high, Number(b.h));
        low = Math.min(low, Number(b.l));
        volume += Number(b.v) || 0;
      });
      open = Number(bars[0].o);
      oi = Number(last.p);
      statDate = bars[0].d.slice(0, 10);
    } else if (lastDay){
      open = Number(lastDay.o); high = Number(lastDay.h); low = Number(lastDay.l);
      volume = Number(lastDay.v); oi = Number(lastDay.p); statDate = lastDay.d;
    }
    var change = prevRef ? price - prevRef : null;
    var pct = prevRef ? change / prevRef * 100 : null;
    var closes = days.map(function(r){ return Number(r.c); }).filter(function(x){ return isFinite(x); });
    var ma20 = closes.length >= 20 ? closes.slice(-20).reduce(function(a,b){return a+b;}, 0) / 20 : null;
    var ma60 = closes.length >= 60 ? closes.slice(-60).reduce(function(a,b){return a+b;}, 0) / 60 : null;
    return {
      key: leg.key, contract: leg.symbol, name: leg.name, exchange: leg.exchange,
      unit: leg.unit, dec: leg.dec, price: price, prev_settle: prevRef,
      change: change, pct: pct, open: open, high: high, low: low,
      volume: volume, oi: oi, trade_date: last.d.slice(0, 10), quote_time: last.d,
      ma20: ma20, ma60: ma60
    };
  }

  function loadLeg(leg){
    return Promise.all([
      jsonp(leg.key + "MIN", "getFewMinLine", leg.symbol, "&type=1"),
      jsonp(leg.key + "DAY", "getDailyKLine", leg.symbol, "")
    ]).then(function(res){ return summarize(leg, res[0], res[1]); });
  }

  function card(it){
    var d = it.dec == null ? 2 : it.dec;
    var dir = dirOf(it.change);
    var sign = it.change > 0 ? "+" : "";
    var pctSign = it.pct > 0 ? "+" : "";
    return '' +
      '<article class="card ' + dir + '">' +
        '<div class="card-head"><span class="ticker">' + it.key + '</span><span class="contract">' + it.contract + '</span><span class="exch">' + it.exchange + '</span></div>' +
        '<div class="name">' + it.name + '</div>' +
        '<div class="quote"><span class="price">' + nf(it.price, d) + '</span><span class="unit">' + it.unit + '</span></div>' +
        '<div class="delta ' + dir + '">' + sign + nf(it.change, d) + ' <span>(' + pctSign + nf(it.pct, 2) + '%)</span><em>较昨结算</em></div>' +
        '<div class="stats">' +
          '<div><span>开盘</span><b>' + nf(it.open, d) + '</b></div>' +
          '<div><span>最高</span><b>' + nf(it.high, d) + '</b></div>' +
          '<div><span>最低</span><b>' + nf(it.low, d) + '</b></div>' +
          '<div><span>成交量</span><b>' + nf(it.volume, 0) + ' 手</b></div>' +
          '<div><span>持仓量</span><b>' + nf(it.oi, 0) + ' 手</b></div>' +
          '<div><span>昨结算</span><b>' + nf(it.prev_settle, d) + '</b></div>' +
        '</div>' +
        '<div class="card-foot"><span>行情时间 ' + hhmmss(it.quote_time) + '</span><span>' + (it.trade_date || "") + '</span></div>' +
      '</article>';
  }

  function statusOf(items){
    var latest = null;
    items.forEach(function(i){ var d = parseCst(i.quote_time); if (d && (!latest || d > latest)) latest = d; });
    if (!latest) return "—";
    var age = (Date.now() - latest.getTime()) / 60000;
    if (age <= 10) return "交易中";
    var now = cstNow();
    var today = now.toISOString().slice(0, 10);
    var latestDate = new Date(latest.getTime() + 8*3600*1000).toISOString().slice(0, 10);
    if (latestDate !== today) return "休市";
    var t = now.getUTCHours() * 60 + now.getUTCMinutes();
    if (t > 11*60+30 && t < 13*60) return "午间休市";
    if (t < 9*60+30) return "未开盘";
    return "已收盘";
  }

  function render(items){
    PF.items = items;
    grid.innerHTML = items.map(card).join("");
    var latestStr = null;
    items.forEach(function(i){ if (i.quote_time && (!latestStr || i.quote_time > latestStr)) latestStr = i.quote_time; });
    if (latestStr) dataTimeEl.textContent = latestStr.slice(5);
    setPill(statusOf(items));
    notice.hidden = true;
    renderPortfolio();
  }

  function schedule(ms){
    nextAt = Date.now() + (ms || REFRESH_MS);
    tick();
  }
  function tick(){
    clockEl.textContent = fmtClock(new Date());
    if (!nextAt){ nextTimeEl.textContent = "—"; return; }
    var left = Math.max(0, nextAt - Date.now());
    var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
    nextTimeEl.textContent = m + " 分 " + String(s).padStart(2, "0") + " 秒";
    if (left <= 0 && !loading) load();
  }

  function load(){
    if (loading) return;
    loading = true; btn.disabled = true;
    Promise.all(LEGS.map(loadLeg)).then(function(items){
      render(items);
      schedule(REFRESH_MS);
    }).catch(function(err){
      notice.hidden = false;
      notice.textContent = "⚠ 行情获取失败：" + (err && err.message ? err.message : err) + "（稍后自动重试）";
      schedule(60 * 1000);
    }).finally(function(){
      loading = false; btn.disabled = false;
    });
  }

  btn.addEventListener("click", function(){ load(); });
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && nextAt && Date.now() >= nextAt) load();
  });
  setInterval(tick, 1000);
  load();
})();
</script>
